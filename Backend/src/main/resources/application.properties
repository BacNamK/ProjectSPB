spring.application.name=projectTLearn

server.port=${SERVER_PORT:8080}

server.servlet.context-path=/api

spring.aop.proxy-target-class=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ProjectTLearn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ProjectTLearn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
